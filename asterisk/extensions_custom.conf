; extensions_custom.conf
; ======================
; SIKKER at redigere i hånden: FreePBX overskriver IKKE denne fil.
; Placeres pa serveren som: /etc/asterisk/extensions_custom.conf
; Aktiveres med:            asterisk -rx "dialplan reload"
;
; Reglen: enhver fil der ender pa _custom.conf rores ikke af FreePBX.
; Konteksterne 'from-internal-custom' og 'custom-*' er automatisk
; tilgaengelige fra den ovrige dialplan.

; Egen dialplan for internt genererede opkald.
; 'from-internal-custom' er auto-inkluderet i 'from-internal'.
[from-internal-custom]
; Eksempel - internt nummer / kortkode:
; exten => 8123,1,Playback(demo-congrats)
; exten => 8123,2,Hangup()

; Egne destinations-kontekster til henvisning fra fx IVR / ringegruppe.
; Navnet SKAL starte med 'custom-'. Henvises som: custom-<navn>,<exten>,<pri>
[custom-jagerstuen]
; Eksempel - 'Ring til Jaegerstuen' -> ringer lokaltelefonens extension:
; exten => s,1,Dial(PJSIP/<EXTENSIONNUMMER>,,30)
; exten => s,2,Hangup()
