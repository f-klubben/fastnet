; pjsip_custom.conf
; ==================
; Placeres på serveren som: /etc/asterisk/pjsip_custom.conf
; Aktiveres med:            asterisk -rx "module reload res_pjsip.so"

; Eksempel - trunk til fastnetudbyderen (fx viptel.dk), manuelt:
; [viptel-trunk]
; type = endpoint
; context = from-trunk
; disallow = all
; allow = ulaw
; aors = viptel-trunk
; auth = viptel-trunk-auth
;
; [viptel-trunk]
; type = aor
; contact = sip:<brugernavn>@<udbyder-host>
; qualify_frequency = 60
;
; [viptel-trunk-auth]
; type = auth
; auth_type = userpass
; username = <brugernavn>
; password = <adgangskode>

; Eksempel - lokal extension som PJSIP-endpoint (telefonen), manuelt:
; [lokal-telefon]
; type = endpoint
; context = from-internal
; disallow = all
; allow = ulaw
; aors = lokal-telefon
; auth = lokal-telefon-auth
;
; [lokal-telefon]
; type = aor
; max_contacts = 1
; qualify_frequency = 60
;
; [lokal-telefon-auth]
; type = auth
; auth_type = userpass
; username = <extensionnummmer>
; password = <adgangskode>
