; extensions_override_freepbx.conf
; ================================
; SIKKER at redigere i haanden: FreePBX overskriver IKKE denne fil.
; Placeres pa serveren som: /etc/asterisk/extensions_override_freepbx.conf
; Aktiveres med:            asterisk -rx "dialplan reload"
;
; Bruges KUN til at tilsidesaette en FreePBX-genereret kontekst (fx
; 'from-internal' eller en indgaaende rute). Genskab hele konteksten her:
; dine definitioner overskriver da FreePBX' version ved reload.
;
; Eksempel:
; [from-internal]
; include => from-internal-custom
; exten => _X.,1,Goto(custom-jagerstuen,s,1)
