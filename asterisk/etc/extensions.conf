[from-sip]
; --- your SIP endpoint (101) lands in this context ---

; 100 = welcome prompt
exten => 100,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; 6767 = Go to main-menu
exten => 6767,1,Answer()
 same => n,Set(TIMEOUT(response)=8),
 same => n,Set(TRIES=0)
 same => n,Goto(main-menu,s,1)

; 700 = speak after the beep, press # to finish
exten => 700,1,Answer()
 same => n,Record(/var/lib/asterisk/sounds/custom/stregsystemet-menu2.wav,3,30,k)
 same => n,Hangup()

; 900 = ATA190 port 1
exten => 900,1,Dial(PJSIP/190,30)
 same => n,Hangup()

[from-internal]
include => from-sip

[main-menu]
exten => s,1,Background(/var/lib/asterisk/sounds/custom/main-menu)
 same => n,WaitExten()

; Viderestil til Jægerstuen
exten => 1,1,Playback(/var/lib/asterisk/sounds/custom/troll)

; Viderestil til Forstyrrelsen
exten => 2,1,Playback(/var/lib/asterisk/sounds/custom/troll)
 same => n,Hangup()

; Køb vare i Stregsystemet
exten => 3,1,Goto(stregsystemet-login,s,1)

; Produkter tilgængelig i Stregsystemet
exten => 4,1,Playback(/var/lib/asterisk/sounds/custom/troll)
 same => n,Hangup()

exten => 5,1,Goto(main-menu,s,1)

; Invalid key, retry menu
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(6767,1)

; Opkald sluttet naturligt
exten => t,1,Hangup()

[stregsystemet-login]
exten => s,1,Set(CODE=)
 same => n,Read(CODE,/var/lib/asterisk/sounds/custom/stregsystemet-login,4,,2,8)
 same => n,GotoIf($["${CODE}" = ""]?noinput)
 same => n,AGI(check_code.py,${CODE})
 same => n,GotoIf($["${AGI_RESULT}" = ""]?invalid-code)
 ; member exists
 same => n,Goto(stregsystemet-menu,s,1)

 ; member did not exist
 same => n(invalid-code),Playback(/var/lib/asterisk/sounds/custom/stregsystemet-member-no-exist)
 same => n,Goto(main-menu,s,1)

; Køb en vare
exten => 1,1,Echo()

[stregsystemet-menu]
exten => s,1,Background(/var/lib/asterisk/sounds/custom/stregsystemet-menu)
 same => n,WaitExten()

; Køb vare
exten => 1,1,Playback(/var/lib/asterisk/sounds/custom/troll)
 same => n,Hangup()

; Hør saldo
exten => 2,1,Playback(/var/lib/asterisk/sounds/custom/troll)
 same => n,Hangup()


exten => i,1,Goto(stregsystemet-menu,s,1)

exten => t,1,Hangup()
