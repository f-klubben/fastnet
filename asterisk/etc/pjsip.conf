; pjsip_custom.conf
; ==================
; Placeres på serveren som: /etc/asterisk/pjsip_custom.conf
; Aktiveres med:            asterisk -rx "module reload res_pjsip.so"

; Eksempel - trunk til fastnetudbyderen (fx viptel.dk), manuelt:
; [viptel-trunk]
; type = endpoint
; context = from-trunk
; disallow = all
; allow = ulaw
; aors = viptel-trunk
; auth = viptel-trunk-auth
;
; [viptel-trunk]
; type = aor
; contact = sip:<brugernavn>@<udbyder-host>
; qualify_frequency = 60
;
; [viptel-trunk-auth]
; type = auth
; auth_type = userpass
; username = <brugernavn>
; password = <adgangskode>

; Eksempel - lokal extension som PJSIP-endpoint (telefonen), manuelt:
; [lokal-telefon]
; type = endpoint
; context = from-internal
; disallow = all
; allow = ulaw
; aors = lokal-telefon
; auth = lokal-telefon-auth
;
; [lokal-telefon]
; type = aor
; max_contacts = 1
; qualify_frequency = 60
;
; [lokal-telefon-auth]
; type = auth
; auth_type = userpass
; username = <extensionnummmer>
; password = <adgangskode>


; Minimal PJSIP config for local softphone (written Nov 2026)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[101]
type=endpoint
context=from-sip
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=opus
direct_media=no
force_rport=yes
callerid="Softphone User" <101>
transport=transport-udp
auth=101
aors=101

[101]
type=auth
auth_type=userpass
username=101
password=yklNQRbGPGQloyC0

[101]
type=aor
max_contacts=1
remove_existing=yes

; ATA modem
[ata190-p1]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
aors=ata190-p1
direct_media=no
dtmf_mode=rfc4733

[ata190-p1]
type=aor
contact=sip:192.168.2.67:5060

[ata190-p1-identify]
type=identity
endpoint=ata190-p1
match=192.168.2.67

